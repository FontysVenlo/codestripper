name: Test

defaults:
  run:
    shell: bash

# Only on pull requests: main only changes through squash-merged PRs, which
# have already passed these checks.
on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --locked
    - name: Run tests
      run: uv run pytest --cov --cov-report=xml --junitxml=tests.xml
    - name: Test Report
      uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: Test Results (Python version ${{ matrix.python-version }})
        path: tests.xml
        reporter: java-junit

  coverage:
    strategy:
      matrix:
        python-version: [ "3.12" ]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --junitxml=tests.xml
      - name: Code Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '90 95'
      - name: Output Code Coverage (Python version ${{ matrix.python-version }})
        run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

  typecheck:
    strategy:
      matrix:
        python-version: [ "3.12" ]
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Type checker
        run: uv run mypy codestripper
