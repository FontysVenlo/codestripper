name: Release CodeStripper to PyPi

on:
  push:
    branches:
      - 'releases/**'
    tags:
      - 'v*'

jobs:
  release:
    strategy:
        matrix:
          python-version: ["3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Build
        run: uv build
      - name: Publish
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
