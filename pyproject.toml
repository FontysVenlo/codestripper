[project]
name = "codestripper"
version = "1.2.0"
description = "CodeStripper used to strip code from assignments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bonajo", email = "m.bonajo@fontys.nl" }]
maintainers = [{ name = "Bonajo", email = "m.bonajo@fontys.nl" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/FontysVenlo/codestripper"
Repository = "https://github.com/FontysVenlo/codestripper"

[project.scripts]
codestripper = "codestripper.cli:main"

[dependency-groups]
lint = [
    "ruff>=0.16.8",
]
test = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.0.0,<8",
    "mypy>=1.0.0,<2",
]

[tool.uv]
default-groups = ["test", "lint"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "codestripper"
module-root = ""

[tool.ruff]
# Same as the PyCharm default
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Comparable to the PyCharm inspections: PEP 8 (E, W), unused code and unresolved names (F),
# naming conventions (N) and shadowing of builtins (A)
select = ["E", "W", "F", "N", "A"]

[tool.ruff.lint.per-file-ignores]
# Imports in an __init__.py are the public interface of the package
"__init__.py" = ["F401"]
